name: Application checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: application-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-checks:
    name: Node, Rust tests and Clippy
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: BFR-Utility-Project/package-lock.json

      - name: Install JavaScript dependencies
        working-directory: BFR-Utility-Project
        run: npm ci

      - name: Run JavaScript release-contract tests
        working-directory: BFR-Utility-Project
        run: npm test

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Run Rust tests
        working-directory: BFR-Utility-Project
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Run synthetic Run History performance baseline
        working-directory: BFR-Utility-Project
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml history_performance_baseline_large_synthetic_history -- --ignored --nocapture

      - name: Run Clippy
        working-directory: BFR-Utility-Project
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Build Windows NSIS installer
        working-directory: BFR-Utility-Project
        run: |
          npm run build:windows:playtest
          if (-not (Get-ChildItem -Path 'src-tauri/target/release/bundle/nsis' -Filter '*setup.exe' -ErrorAction SilentlyContinue)) {
            throw 'Tauri build completed without producing the expected NSIS setup installer.'
          }

      - name: Upload Windows NSIS installer
        uses: actions/upload-artifact@v7
        with:
          name: windows-nsis-installer
          path: BFR-Utility-Project/src-tauri/target/release/bundle/nsis/*setup.exe
          if-no-files-found: error
          retention-days: 7

  dependency-audit:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/security-audit.yml
