name: Application checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: application-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-checks:
    name: Node, Rust tests and Clippy
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: BFR-Utility-Project/package-lock.json

      - name: Install JavaScript dependencies
        working-directory: BFR-Utility-Project
        run: npm ci

      - name: Run JavaScript release-contract tests
        working-directory: BFR-Utility-Project
        run: npm test

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Refresh Cargo.lock for the Wry patch
        working-directory: BFR-Utility-Project
        run: cargo update -p wry --manifest-path src-tauri/Cargo.toml

      - name: Commit refreshed Cargo.lock
        if: github.event_name == 'pull_request'
        working-directory: BFR-Utility-Project
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/Cargo.lock
          if (-not (git diff --cached --quiet)) {
            git commit -m "deps: refresh Cargo.lock for Wry 0.57.2"
            git fetch origin "${{ github.head_ref }}"
            git rebase "origin/${{ github.head_ref }}"
            git push origin HEAD:${{ github.head_ref }}
          }

      - name: Run Rust tests
        working-directory: BFR-Utility-Project
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Run Clippy
        working-directory: BFR-Utility-Project
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Build Windows NSIS installer
        working-directory: BFR-Utility-Project
        run: |
          npm run build:windows
          if (-not (Get-ChildItem -Path 'src-tauri/target/release/bundle/nsis' -Filter '*setup.exe' -ErrorAction SilentlyContinue)) {
            throw 'Tauri build completed without producing the expected NSIS setup installer.'
          }
