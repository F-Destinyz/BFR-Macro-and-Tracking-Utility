name: One-time merged branch housekeeping

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/housekeep-merged-branches.yml

permissions:
  contents: write
  pull-requests: read

jobs:
  delete-verified-merged-branches:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Delete only verified merged PR branches
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Fetching all repository branches and pull requests..."
          branches="$(gh api --paginate --slurp "repos/${REPO}/branches?per_page=100" | jq -c 'add')"
          closed_prs="$(gh api --paginate --slurp "repos/${REPO}/pulls?state=closed&per_page=100" | jq -c 'add')"
          open_prs="$(gh api --paginate --slurp "repos/${REPO}/pulls?state=open&per_page=100" | jq -c 'add')"

          candidates="$(jq -cn \
            --argjson branches "$branches" \
            --argjson closed "$closed_prs" \
            --argjson open "$open_prs" '
            [
              $branches[] as $b
              | select($b.name != "main")
              | select(($b.name | test("^(dependabot/|audit/|maintenance/|experimental/)"; "i")) | not)
              | select(all($open[]; .head.ref != $b.name))
              | select(any($closed[];
                  .merged_at != null
                  and .base.ref == "main"
                  and .head.ref == $b.name
                  and .head.sha == $b.commit.sha
                ))
              | {name: $b.name, sha: $b.commit.sha}
            ]')"

          count="$(jq 'length' <<< "$candidates")"
          echo "Verified deletion candidates: $count"
          jq -r '.[] | "  - \(.name) @ \(.sha)"' <<< "$candidates"

          deleted=0
          skipped=0
          while IFS= read -r item; do
            name="$(jq -r '.name' <<< "$item")"
            expected_sha="$(jq -r '.sha' <<< "$item")"

            if ! current_sha="$(gh api "repos/${REPO}/git/ref/heads/${name}" --jq '.object.sha' 2>/dev/null)"; then
              echo "::notice::Skipping ${name}: branch no longer exists."
              skipped=$((skipped + 1))
              continue
            fi

            if [[ "$current_sha" != "$expected_sha" ]]; then
              echo "::warning::Skipping ${name}: branch moved after verification."
              skipped=$((skipped + 1))
              continue
            fi

            gh api --method DELETE "repos/${REPO}/git/refs/heads/${name}"
            echo "Deleted verified merged branch: ${name}"
            deleted=$((deleted + 1))
          done < <(jq -c '.[]' <<< "$candidates")

          echo "Housekeeping result: deleted=${deleted}, skipped=${skipped}"

      - name: Remove this one-time workflow
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          workflow_sha="$(gh api "repos/${REPO}/contents/.github/workflows/housekeep-merged-branches.yml" --jq '.sha')"
          gh api --method DELETE "repos/${REPO}/contents/.github/workflows/housekeep-merged-branches.yml" \
            -f message="chore(repo): remove one-time branch housekeeping workflow" \
            -f sha="$workflow_sha" \
            -f branch=main
          echo "Removed the temporary housekeeping workflow."
