[[permission]]
identifier = "allow-tracker-dashboard-controls"
description = "Allows the local tracker dashboard to read, clear, and manage its saved reward history, including deleting an individual entry."
commands.allow = ["tracker_read_data_page", "tracker_clear_history", "tracker_delete_history_entry", "tracker_get_pinned", "tracker_set_pinned", "tracker_open_reward_samples_folder"]

[[permission]]
identifier = "deny-tracker-dashboard-controls"
description = "Denies reading saved Run History records."
commands.deny = ["tracker_read_data_page"]

[[permission]]
identifier = "deny-tracker-set-pinned"
description = "Denies changing tracker always-on-top state."
commands.deny = ["tracker_set_pinned"]

[[permission]]
identifier = "deny-tracker-clear-history"
description = "Denies clearing saved Run History records."
commands.deny = ["tracker_clear_history"]
